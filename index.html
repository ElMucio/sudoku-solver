<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Solver — Dal 9×9 Classico al 16×16</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="3" y="3" width="22" height="22" rx="4" />
            <line x1="10.33" y1="3" x2="10.33" y2="25" />
            <line x1="17.66" y1="3" x2="17.66" y2="25" />
            <line x1="3" y1="10.33" x2="25" y2="10.33" />
            <line x1="3" y1="17.66" x2="25" y2="17.66" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Sudoku Solver</h1>
          <p class="brand-subtitle">100% Offline &bull; Dal 9&times;9 al 16&times;16</p>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="segmented-group" role="group" aria-label="Dimensione griglia">
          <button type="button" class="seg-btn active" data-size="9">9&times;9 <span class="seg-sub">Classico</span></button>
          <button type="button" class="seg-btn" data-size="12">12&times;12 <span class="seg-sub">3&times;4</span></button>
          <button type="button" class="seg-btn" data-size="16">16&times;16 <span class="seg-sub">Maxi</span></button>
        </div>

        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Cambia tema Chiaro o Dark" title="Cambia tema (Bianco / Dark)">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span id="themeLabel">Dark</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="board-section" aria-label="Griglia Sudoku">
        <div class="board-toolbar">
          <div class="status-pill" id="statusBanner" role="status" aria-live="polite">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Inserisci i numeri noti o carica un esempio, poi premi Risolvi.</span>
          </div>

          <div class="notation-bar" id="notationWrapper" hidden>
            <label for="notationSelect" class="notation-label">Simboli:</label>
            <select id="notationSelect" class="select-input">
              <option value="alphanum1">1–9, A–G ( Lettere )</option>
              <option value="numeric">1–16 ( Numeri )</option>
              <option value="hex0">0–9, A–F ( Esadecimale )</option>
            </select>
          </div>
        </div>

        <div class="board-frame">
          <div id="sudokuGrid" class="sudoku-grid size-9" role="grid" aria-label="Celle del Sudoku"></div>
        </div>

        <div class="board-footer">
          <div class="legend">
            <span class="legend-item"><span class="swatch swatch-clue"></span> Dati inseriti</span>
            <span class="legend-item"><span class="swatch swatch-solved"></span> Risolti dal calcolatore</span>
            <span class="legend-item"><span class="swatch swatch-conflict"></span> Conflitto</span>
          </div>
          <div class="stats-readout" id="statsReadout">Celle piene: 0 / 81</div>
        </div>
      </section>

      <aside class="controls-panel" aria-label="Comandi e tastierino">
        <div class="card">
          <h2 class="card-title">Risoluzione</h2>
          <div class="primary-actions">
            <button type="button" id="solveBtn" class="btn btn-primary btn-lg">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              Risolvi Sudoku
            </button>
            <div class="action-grid-2">
              <button type="button" id="hintBtn" class="btn btn-secondary" title="Rivela il valore corretto di una singola cella">
                Suggerisci 1 Cella
              </button>
              <button type="button" id="verifyBtn" class="btn btn-secondary" title="Controlla conflitti e unicità della soluzione">
                Verifica Schema
              </button>
              <button type="button" id="clearSolvedBtn" class="btn btn-outline" title="Cancella solo le celle calcolate, mantenendo i tuoi dati">
                Togli Soluzione
              </button>
              <button type="button" id="clearAllBtn" class="btn btn-danger-outline" title="Svuota completamente tutta la griglia">
                Svuota Tutto
              </button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h2 class="card-title">Tastierino Rapido</h2>
            <span class="kbd-hint">Usa anche tastiera e frecce</span>
          </div>
          <div id="keypad" class="keypad keypad-9"></div>
          <button type="button" id="eraseCellBtn" class="btn btn-outline btn-block erase-btn">
            Cancella Cella Selezionata (Canc / Backspace)
          </button>
        </div>

        <div class="card">
          <h2 class="card-title">Schemi &amp; Importazione</h2>
          <div class="preset-row">
            <select id="exampleSelect" class="select-input flex-1" aria-label="Scegli uno schema di esempio">
              <option value="0">Esempio 1 — Classico Equilibrato</option>
              <option value="1">Esempio 2 — Difficile</option>
              <option value="2">Esempio 3 — Esperto</option>
            </select>
            <button type="button" id="loadExampleBtn" class="btn btn-secondary">Carica</button>
          </div>
          <div class="preset-actions">
            <button type="button" id="generateBtn" class="btn btn-outline btn-block">
              Genera Nuovo Schema Casuale
            </button>
            <button type="button" id="toggleImportBtn" class="btn btn-ghost btn-block">
              Importa / Esporta come Testo
            </button>
          </div>

          <div id="importDrawer" class="import-drawer" hidden>
            <label for="importTextarea" class="import-help">
              Incolla o copia lo schema (usa <code>.</code> o <code>0</code> per le celle vuote; spazi o righe supportati):
            </label>
            <textarea id="importTextarea" class="import-textarea" rows="4" spellcheck="false"></textarea>
            <div class="action-grid-2">
              <button type="button" id="applyImportBtn" class="btn btn-primary btn-sm">Applica alla Griglia</button>
              <button type="button" id="copyExportBtn" class="btn btn-secondary btn-sm">Copia Schema Attuale</button>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="solver.js"></script>
  <script src="app.js"></script>
</body>
</html>
